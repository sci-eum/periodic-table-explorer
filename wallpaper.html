<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주기율표 배경화면</title>
<meta name="description" content="원소가 차례로 빛나고 보기 방식이 저절로 바뀌는, 바탕화면용 움직이는 주기율표">
<script src="fonts/tamheom-sans.js"></script>
<link rel="stylesheet" href="css/wallpaper.css">
</head>
<body>
<!-- 1600×900 기준으로 그리고 화면 크기에 맞춰 통째로 확대·축소해요. 왼쪽 여백은 바탕화면 아이콘 자리예요. -->
<div class="stage" id="stage">
  <header class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="-24 -24 48 48">
        <g class="logo-orbits">
          <ellipse rx="20" ry="7.5" />
          <ellipse rx="20" ry="7.5" transform="rotate(60)" />
          <ellipse rx="20" ry="7.5" transform="rotate(120)" />
        </g>
        <circle class="logo-nuc" r="4.5" />
        <g class="logo-spin"><circle class="logo-e" cx="20" cy="0" r="2.6" /></g>
      </svg>
    </div>
    <p class="brand-name">주기율표 탐험실</p>
    <ol class="views" id="views" aria-label="보기 순서"></ol>
  </header>

  <section class="board" aria-label="주기율표">
    <div class="wt" id="wt" data-view="category"></div>
  </section>

  <aside class="spot" id="spot" aria-live="polite"></aside>
</div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/wallpaper.js"></script>
</body>
</html>
